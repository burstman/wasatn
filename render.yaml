# Render blueprint for WasaTN.
#
# Deploy with: New > Blueprint, point it at this repo, then fill in the secret
# values it asks for. Database migrations are NOT run automatically: the Neon
# schema is already at version 4, so run `make migrate` locally when the
# schema changes.
#
# Generated secrets on a POSIX machine:
#   SESSION_SECRET=$(openssl rand -hex 32)
#   TOKEN_ENCRYPTION_KEY=$(openssl rand -hex 32)
#   CRON_SECRET=$(openssl rand -hex 32)

services:
  - type: web
    name: wasatn
    runtime: go
    plan: free
    region: oregon
    # The binary must be written inside the project directory: Render uploads
    # the build output to the runtime container, and /tmp does not come along.
    buildCommand: go build -o ./bin/server ./cmd/server
    startCommand: ./bin/server
    healthCheckPath: /healthz
    # The Go version comes from .go-version so a Render image change cannot
    # silently downgrade the build below River's 1.26 requirement.
    envVars:
      - key: SUPERKIT_ENV
        value: production
      - key: TRUST_PROXY
        value: "true" # Render terminates TLS and sets X-Forwarded-Proto
      # hostedDomainName, not host: `host` yields only the short service name
      # ("wasatn"), which produces https://wasatn and an OAuth redirect URI that
      # matches nothing registered in Meta. The app rejects a single-label host
      # at startup so this cannot fail quietly again.
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: wasatn
          property: hostedDomainName
      - key: SESSION_COOKIE_NAME
        value: wasatn_session
      - key: META_GRAPH_VERSION
        value: v25.0 # Embedded Signup v4 is documented against this version
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_FB_CONFIG_ID
        sync: false # Embedded Signup configuration id: public, not a secret

  # Uncomment when campaign jobs land (milestone 5). Render Background Workers
  # need a paid plan, so keep this commented while the queue is empty: the
  # worker exits immediately with "no job kinds are registered yet".
  # - type: worker
  #   name: wasatn-worker
  #   runtime: go
  #   plan: starter
  #   region: oregon
  #   buildCommand: go build -o ./bin/worker ./cmd/worker
  #   startCommand: ./bin/worker
  #   envVars: ...
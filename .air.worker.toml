root = "."
tmp_dir = "tmp"

[build]
  # Run the River worker on changes.
  bin = "tmp/worker"
  cmd = "go build -o tmp/worker ./cmd/worker"
  delay = 300
  stop_on_error = false
  send_interrupt = true
  kill_delay = 5s
  include_ext = ["go", "templ"]
  exclude_dir = ["bin", "tmp", "static", "migrations", "node_modules"]
  exclude_regex = ["_test\\.go$"]

[log]
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true